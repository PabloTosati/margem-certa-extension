<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Fone de Ouvido Bluetooth (página de exemplo)</title>
  <style>
    body { margin: 0; font: 15px/1.5 "Segoe UI", Roboto, Arial, sans-serif; background: #ededed; color: #333; }
    .nav { height: 56px; background: #fff159; }
    main { max-width: 1000px; margin: 24px auto; background: #fff; border-radius: 8px; padding: 32px; display: grid; grid-template-columns: 360px 1fr; gap: 32px; }
    .photo { height: 360px; border-radius: 8px; background: linear-gradient(135deg, #e8edf5, #cfd8e6); display: flex; align-items: center; justify-content: center; color: #6b7690; }
    h1 { font-size: 22px; font-weight: 600; margin: 4px 0 16px; }
    .sub { color: #999; font-size: 13px; }
    .andes-money-amount { font-size: 36px; font-weight: 300; }
    .andes-money-amount__cents { font-size: 18px; vertical-align: super; }
    .ship { color: #00a650; font-weight: 600; margin-top: 8px; }
    .btn { margin-top: 24px; display: inline-block; background: #3483fa; color: #fff; padding: 14px 40px; border-radius: 6px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="nav"></div>
  <main>
    <div class="photo">Foto do produto</div>
    <div>
      <div class="sub">Novo | +500 vendidos · Página de exemplo</div>
      <h1>Fone de Ouvido Bluetooth Sem Fio com Cancelamento de Ruído</h1>
      <div class="ui-pdp-price__second-line">
        <span class="andes-money-amount">
          <span class="andes-money-amount__currency-symbol">R$</span>
          <span class="andes-money-amount__fraction">129</span><span class="andes-money-amount__cents">90</span>
        </span>
      </div>
      <div class="ship">Frete grátis</div>
      <span class="btn">Comprar agora</span>
    </div>
  </main>
</body>
</html>
